spring:
  datasource:
    url: jdbc:h2:mem:food;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  # Flyway migrations target PostgreSQL; the H2 test database is created from the JPA
  # entities via ddl-auto=create-drop instead.
  flyway:
    enabled: false
  jpa:
    hibernate:
      ddl-auto: create-drop

jwt:
  secret: test-jwt-secret-must-be-at-least-thirty-two-bytes
  expiration: 900000
  refresh-expiration: 604800000
